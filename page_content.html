   Design System Tokens - 财务洗头膏
   ============================================================ */
/* ============================================================
   财务洗头膏 — Webfonts
   Chinese-first UI (Noto Sans SC) + Latin display (Space Grotesk)
   + ledger numerals / labels (Space Mono).
   Loaded from Google Fonts.
   ============================================================ */
/* ============================================================
   财务洗头膏 — Color tokens
   World: soap-bubble freshness. Aqua-mint primary, soap-bubble
   blue secondary, deep teal ink, lots of white. Iridescent lilac
   used sparingly as a "bubble shimmer" accent.
   ============================================================ */
:root {
  /* ---- Brand: aqua-mint (primary) ---------------------------- */
  --mint-50:  #E8FBF7;
  --mint-100: #CFF6EF;
  --mint-200: #9FEDDF;
  --mint-300: #66E0CB;
  --mint-400: #2DCFB5;
  --mint-500: #12C7AE;   /* primary brand */
  --mint-600: #0AA694;
  --mint-700: #0A8576;
  --mint-800: #0E665B;
  --mint-900: #103F39;

  /* ---- Soap-bubble blue (secondary) -------------------------- */
  --blue-50:  #EAF4FF;
  --blue-100: #D2E7FF;
  --blue-200: #A9D0FF;
  --blue-300: #79B4FF;
  --blue-400: #4D9BFF;
  --blue-500: #2E84F5;   /* secondary */
  --blue-600: #1E6AD6;
  --blue-700: #1A54A8;

  /* ---- Iridescent lilac (shimmer accent — sparing) ----------- */
  --lilac-300: #D4CCFF;
  --lilac-400: #B8AEFF;
  --lilac-500: #9C8FF5;

  /* ---- Ink: cool teal-tinted neutrals ------------------------ */
  --ink-950: #071A1D;
  --ink-900: #0C2A2E;
  --ink-800: #163A3F;
  --ink-700: #2B4C51;
  --ink-600: #46676C;
  --ink-500: #62858A;
  --ink-400: #8AA8AC;
  --ink-300: #B4CBCE;
  --ink-200: #D6E5E6;
  --ink-100: #E9F2F2;
  --ink-50:  #F4F9F9;
  --white:   #FFFFFF;

  /* ---- Semantic ---------------------------------------------- */
  --success: #0FB57E;
  --success-soft: #E2F7EF;
  --warning: #F4A52E;
  --warning-soft: #FCEFD7;
  --danger:  #F2545B;
  --danger-soft: #FDE6E7;
  --info:    #2E84F5;
  --info-soft: #E5F0FF;

  /* ============================================================
     SEMANTIC ALIASES — reference these in product code
     ============================================================ */

  /* surfaces */
  --surface-canvas:  #F3FAF9;   /* app / page background, faint mint */
  --surface-card:    #FFFFFF;
  --surface-sunken:  #ECF6F4;
  --surface-inverse: #0C2A2E;
  --surface-brand-soft: #E8FBF7;
  --surface-overlay: rgba(7, 26, 29, 0.45);

  /* text */
  --text-strong:   var(--ink-900);
  --text-body:     var(--ink-700);
  --text-muted:    var(--ink-500);
  --text-subtle:   var(--ink-400);
  --text-on-brand: #052B27;
  --text-on-dark:  #EAF6F4;
  --text-link:     var(--blue-600);

  /* brand / interactive */
  --brand:           var(--mint-500);
  --brand-hover:     var(--mint-600);
  --brand-active:    var(--mint-700);
  --brand-contrast:  #052B27;   /* text on a mint fill */
  --secondary:       var(--blue-500);
  --secondary-hover: var(--blue-600);

  /* borders & lines */
  --border-subtle:  var(--ink-100);
  --border-default: var(--ink-200);
  --border-strong:  var(--ink-300);
  --border-brand:   var(--mint-300);
  --focus-ring:     rgba(18, 199, 174, 0.45);

  /* ---- Signature gradients (soap-bubble) --------------------- */
  --grad-bubble:  linear-gradient(135deg, #12C7AE 0%, #2E84F5 100%); /* @kind color */
  --grad-shimmer: linear-gradient(120deg, #66E0CB 0%, #79B4FF 45%, #B8AEFF 100%); /* @kind color */
  --grad-foam:    linear-gradient(180deg, #F3FAF9 0%, #E8FBF7 100%); /* @kind color */
  --grad-rinse:   radial-gradient(120% 120% at 0% 0%, #E8FBF7 0%, #EAF4FF 55%, #F3FAF9 100%); /* @kind color */
}
/* ============================================================
   财务洗头膏 — Typography tokens
   Noto Sans SC carries Chinese UI + body. Space Grotesk handles
   Latin display & big numerals. Space Mono = ledger labels.
   CJK runs long line-heights for breathing room.
   ============================================================ */
:root {
  /* font families */
  --font-sans:    system-ui, -apple-system, "Segoe UI", "PingFang SC",
                  "Microsoft YaHei", sans-serif;
  --font-display: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono:    ui-monospace, "Cascadia Mono", "SFMono-Regular", monospace;
  /* numerals — tabular Space Grotesk for ledgers/dashboards */
  --font-num:     "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;

  /* weights */
  --w-regular: 400; /* @kind font */
  --w-medium:  500; /* @kind font */
  --w-bold:    700; /* @kind font */
  --w-black:   900; /* @kind font */

  /* type scale (px) */
  --fs-display-1: 64px;
  --fs-display-2: 48px;
  --fs-h1: 36px;
  --fs-h2: 28px;
  --fs-h3: 22px;
  --fs-title: 18px;
  --fs-body-lg: 18px;
  --fs-body: 16px;
  --fs-body-sm: 14px;
  --fs-caption: 13px;
  --fs-overline: 12px;

  /* line-heights */
  --lh-tight: 1.08;   /* @kind font */
  --lh-snug: 1.25;    /* @kind font */
  --lh-heading: 1.32; /* @kind font */
  --lh-body: 1.75;    /* @kind font */
  --lh-relaxed: 1.85; /* @kind font */

  /* tracking */
  --ls-tight: -0.02em;  /* @kind font */
  --ls-normal: 0;       /* @kind font */
  --ls-wide: 0.04em;    /* @kind font */
  --ls-overline: 0.16em;/* @kind font */

  /* semantic text roles */
  --type-display: var(--w-black) var(--fs-display-1)/var(--lh-tight) var(--font-display); /* @kind font */
  --type-h1: var(--w-bold) var(--fs-h1)/var(--lh-snug) var(--font-sans); /* @kind font */
  --type-h2: var(--w-bold) var(--fs-h2)/var(--lh-heading) var(--font-sans); /* @kind font */
  --type-h3: var(--w-medium) var(--fs-h3)/var(--lh-heading) var(--font-sans); /* @kind font */
  --type-body: var(--w-regular) var(--fs-body)/var(--lh-body) var(--font-sans); /* @kind font */
  --type-mono: var(--w-regular) var(--fs-caption)/1.5 var(--font-mono); /* @kind font */
}
/* ============================================================
   财务洗头膏 — Spacing, radii, shadows, motion
   Soft & bubbly: generous rounding, soft cool-tinted shadows,
   gentle bouncy easing.
   ============================================================ */
:root {
  /* spacing — 4px base */
  --space-0: 0;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;
  --space-24: 96px;
  --space-32: 128px;

  /* radii — bubbly */
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-2xl: 36px;
  --radius-pill: 999px;

  /* shadows — soft, cool teal-tinted */
  --shadow-xs: 0 1px 2px rgba(12, 42, 46, 0.06);
  --shadow-sm: 0 2px 8px rgba(12, 42, 46, 0.07);
  --shadow-md: 0 6px 18px rgba(12, 42, 46, 0.09);
  --shadow-lg: 0 14px 36px rgba(12, 42, 46, 0.12);
  --shadow-xl: 0 28px 60px rgba(12, 42, 46, 0.16);
  /* colored "bubble glow" for primary CTAs / hero elements */
  --shadow-mint: 0 10px 28px rgba(18, 199, 174, 0.32);
  --shadow-blue: 0 10px 28px rgba(46, 132, 245, 0.28);
  /* inner highlight that reads like a bubble's specular sheen */
  --sheen: inset 0 1px 0 rgba(255, 255, 255, 0.6); /* @kind shadow */

  /* motion */
  --dur-fast: 140ms; /* @kind other */
  --dur-base: 240ms; /* @kind other */
  --dur-slow: 420ms; /* @kind other */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);     /* @kind other */
  --ease-bubble: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */
  --ease-inout: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */

  /* layout */
  --container: 1200px; /* @kind other */
  --container-narrow: 760px; /* @kind other */
  --header-h: 72px; /* @kind other */
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html,
body,
#app {

}
html.cw-light-mode *,
html.cw-light-mode *::before,
html.cw-light-mode *::after {
  animation-duration: 0.01ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.01ms !important;
  scroll-behavior: auto !important;

  backdrop-filter: none !important;

a {
  text-decoration: none;
  color: inherit;
}

::-webkit-scrollbar {

}

  background: rgba(0, 0, 0, 0.25);
}
/* 全局Element Plus主题覆盖 - 现代中国风 × 财务专业 */
:root {
  /* Element Plus 主题色 - 使用设计系统薄荷绿 */
  --el-color-primary: var(--mint-500, #12C7AE);
  --el-color-primary-light-3: var(--mint-400, #2DCFB5);
  --el-color-primary-light-5: var(--mint-300, #66E0CB);
  --el-color-primary-light-7: var(--mint-200, #9FEDDF);
  --el-color-primary-light-8: var(--mint-100, #CFF6EF);
  --el-color-primary-light-9: var(--mint-50, #E8FBF7);
  --el-color-primary-dark-2: var(--mint-700, #0A8576);

  /* 表格选中行底色 */
  --el-table-current-row-bg-color: rgba(18, 199, 174, 0.08);
  --el-color-success: var(--success, #0FB57E);
  --el-color-warning: var(--warning, #F4A52E);
  --el-color-danger: var(--danger, #F2545B);
  --el-color-info: var(--info, #2E84F5);
  --el-border-radius-base: var(--radius-md, 14px);
  --el-border-radius-small: var(--radius-sm, 10px);

  /* ========== CW Finance 专用色彩系统 - 现代中国风 ========== */

  /* 主色调 - 薄荷绿系（设计系统）*/
  --cw-red-primary: var(--mint-500, #12C7AE);
  --cw-red-light: var(--mint-400, #2DCFB5);
  --cw-red-lighter: var(--mint-100, #CFF6EF);
  --cw-red-dark: var(--mint-700, #0A8576);
  
  /* 辅助色 - 金色系 */
  --cw-gold-primary: #D4AF37;
  --cw-gold-light: #E8D090;
  --cw-gold-lighter: #F5EDD0;
  
  /* 辅助色 - 玉色系 */
  --cw-jade-primary: #2E8B57;
  --cw-jade-light: #5FA777;
  --cw-jade-lighter: #B8D4C5;
  
  /* 辅助色 - 墨色系 */
  --cw-ink-primary: #2C3E50;
  --cw-ink-light: #546E7A;
  --cw-ink-lighter: #90A4AE;

  /* 财务专用色 */
  --cw-debit-color: #52C41A;
  --cw-credit-color: #FF4D4F;
  --cw-balance-color: #1890FF;
  --cw-gold: #D4AF37;
  --cw-red: var(--mint-500, #12C7AE);

  /* 品牌展示红：深色背景上用较亮柔和红，浅色背景用稍深红 */
  --cw-brand-red: #d96666;
  --cw-brand-red-bg: rgba(217, 102, 102, 0.12);
  --cw-brand-red-border: rgba(217, 102, 102, 0.28);
  --cw-brand-red-on-dark: #f5a0a0;
  --cw-brand-red-on-dark-bg: rgba(245, 160, 160, 0.16);
  --cw-brand-red-on-dark-border: rgba(245, 160, 160, 0.38);

  /* 背景层次 */
  --cw-bg-base: #F5F5F5;
  --cw-bg-elevated: #FFFFFF;
  --cw-bg-subtle: rgba(255, 255, 255, 0.9);
  --cw-bg-hover: rgba(18, 199, 174, 0.06);
  --cw-bg-sidebar: linear-gradient(180deg, #0E665B 0%, #103F39 100%);

  /* 边框层次 */
  --cw-border-light: rgba(0, 0, 0, 0.06);
  --cw-border-medium: rgba(0, 0, 0, 0.12);
  --cw-border-strong: rgba(0, 0, 0, 0.18);

  /* 文本层次 */
  --cw-text-primary: #262626;
  --cw-text-secondary: #595959;
  --cw-text-tertiary: #8C8C8C;
  --cw-text-disabled: #BFBFBF;
  --cw-text-inverse: #FFFFFF;

  /* 阴影层次 */
  --cw-shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.06);
  --cw-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.1);
  --cw-shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
  --cw-shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.16);
  --cw-shadow-red: 0 4px 16px rgba(18, 199, 174, 0.22);

  /* 字体系统 - 现代中国风 */
  --cw-font-heading: 'Noto Sans SC', 'Source Han Sans CN', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --cw-font-body: 'Noto Sans SC', 'Source Han Sans CN', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --cw-font-number: 'DIN Alternate', 'DIN', 'Helvetica Neue', 'Arial', sans-serif;
  --cw-font-accent: 'FZShuSong-Z01S', 'STSong', 'SimSun', serif;

  /* 字号系统 */
  --cw-text-xs: 12px;
  --cw-text-sm: 13px;
  --cw-text-base: 14px;
  --cw-text-lg: 16px;
  --cw-text-xl: 18px;
  --cw-text-2xl: 22px;
  --cw-text-3xl: 28px;

  /* 列表表头 */
  --cw-table-header-font-family: 'Noto Sans SC', 'Source Han Sans CN', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --cw-table-header-font-size: 14px;
  --cw-table-header-font-weight: 700;

  /* 字重系统 */
  --cw-font-normal: 400;
  --cw-font-medium: 500;
  --cw-font-semibold: 700;
  --cw-font-bold: 900;

  /* Z-index 层级系统 */
  --cw-z-table-fixed: 10;
  --cw-z-sticky: 100;
  --cw-z-dropdown: 1000;
  --cw-z-overlay: 1000;
  --cw-z-modal: 2000;
  --cw-z-notification: 3000;
  --cw-z-tooltip: 4000;

  /* 对话框尺寸规范 */
  --cw-dialog-sm: 380px;
  --cw-dialog-md: 500px;
  --cw-dialog-lg: 720px;
  --cw-dialog-xl: 900px;
  --cw-dialog-label-sm: 80px;

}

/* ========== 页面过渡动画 - 苹果风格 ========== */
/* 路由切换动画 - 苹果风格弹簧效果 */
.fade-enter-active,
.fade-leave-active {
  transition: all 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
}
.fade-enter-from {
  opacity: 0;
  transform: translateY(8px);
}
.fade-leave-to {
  opacity: 0;
  transform: translateY(-8px);
}
/* 卡片展开动画 */
.card-expand-enter-active,
.card-expand-leave-active {
  transition: all 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
  transform-origin: top;
}
.card-expand-enter-from,
.card-expand-leave-to {
  opacity: 0;
  transform: scaleY(0.96);
}
/* 数据加载骨架屏 */
.skeleton {
  background: linear-gradient(90deg, rgba(0,0,0,0.04) 25%, rgba(0,0,0,0.08) 50%, rgba(0,0,0,0.04) 75%);
  background-size: 200% 100%;
  animation: skeleton-loading 1.5s ease-in-out infinite;
  border-radius: 8px;
}
@keyframes skeleton-loading {
  0% {
    background-position: 200% 0;
  }
  100% {
    background-position: -200% 0;
  }
}
/* 列表项动画 */
.list-enter-active,
.list-leave-active {
  transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
}
.list-enter-from {
  opacity: 0;
  transform: translateX(-12px);
}
.list-leave-to {
  opacity: 0;
  transform: translateX(12px);
}
/* 模态框动画 */
.modal-enter-active,
.modal-leave-active {
  transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
}
.modal-enter-from,
.modal-leave-to {
  opacity: 0;
  transform: scale(0.96);
}
/* ========== 表格选中行样式统一 ========== */

/* 加载状态优化 */

}

  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.3);
  border-radius: inherit;
  animation: pulse 1.5s ease-in-out infinite;
}

  0%,

}

  box-shadow: 0 4px 14px rgba(18, 199, 174, 0.3) !important;
}

.el-button--primary:not(.is-link):not(.is-text):hover {

}

/* 成功按钮 - 翡翠绿 */
.el-button--success:not(.is-link):not(.is-text) {
  background: linear-gradient(135deg, #0FB57E 0%, #0AA694 100%) !important;
  color: #fff !important;
  box-shadow: 0 4px 12px rgba(15, 181, 126, 0.25) !important;
}

/* 警告按钮 - 活力橙 */
.el-button--warning:not(.is-link):not(.is-text) {
  background: linear-gradient(135deg, #F4A52E 0%, #E68600 100%) !important;
  color: #fff !important;
  box-shadow: 0 4px 12px rgba(244, 165, 46, 0.25) !important;
}

/* 危险按钮 - 珊瑚红 */
.el-button--danger:not(.is-link):not(.is-text) {
  background: linear-gradient(135deg, #F2545B 0%, #E0434A 100%) !important;
  color: #fff !important;
  box-shadow: 0 4px 12px rgba(242, 84, 91, 0.25) !important;
}

/* 信息/次要按钮 - 泡泡蓝 */
.el-button--info:not(.is-link):not(.is-text) {
  background: linear-gradient(135deg, #A9D0FF 0%, #79B4FF 100%) !important;
  color: #1A54A8 !important;
  box-shadow: 0 4px 12px rgba(121, 180, 255, 0.2) !important;
}

/* 默认/朴素按钮 */
.el-button.is-plain:not(.el-button--primary):not(.el-button--success):not(.el-button--warning):not(.el-button--danger):not(.el-button--info) {
  background: var(--white) !important;
  border: 1.5px solid var(--mint-200) !important;
  color: var(--mint-700) !important;
  box-shadow: var(--shadow-xs) !important;
}

.el-button.is-plain:hover {
  background: var(--mint-50) !important;
  border-color: var(--mint-400) !important;
}

/* Link类型按钮 - 极简 */
.el-button.is-link {
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  transform: none !important;
  padding: 4px 8px !important;
  font-weight: 600 !important;
  border-radius: 8px !important;
}

.el-button.is-link:hover {
  background: var(--mint-50) !important;
  transform: translateY(-1px);
}

/* ========== 输入框 (更多特征，更易识别) ========== */

.el-textarea__inner,
.el-select__wrapper {
  border-radius: var(--radius-sm) !important;
  background-color: #f8fbfb !important; /* 淡淡的青绿底色 */

  transition: all var(--duration-fast) var(--ease-out) !important;
}

.el-input__wrapper:hover,
.el-select__wrapper:hover,
.el-textarea__inner:hover {

}

.el-input__wrapper.is-focus,
.el-select__wrapper.is-focus,
.el-textarea__inner:focus {

}

.el-input__inner,

}

  transform: translateY(-4px);
}

.el-card__header {
  padding: 20px 24px !important;
  border-bottom: 1px solid var(--border-subtle) !important;
  background: var(--grad-foam) !important;
}

  overflow: hidden !important;

.el-table th.el-table__cell {

  font-weight: 700 !important;
  color: var(--text-strong) !important;
  border-bottom: 1px solid var(--border-subtle) !important;

.el-table tr:hover > td.el-table__cell {

}

  background: var(--white) !important;
}

.el-dialog__header {
  padding: 24px 32px !important;
  background: var(--grad-rinse, radial-gradient(120% 120% at 0% 0%, #E8FBF7 0%, #EAF4FF 55%, #F3FAF9 100%)) !important;

  border-bottom: 1px solid var(--border-subtle) !important;
  position: relative;
}

.el-dialog__header::after {

  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, var(--mint-300) 0%, transparent 100%);
  opacity: 0.5;
}

.el-dialog__title {
  font-size: 22px !important;
  font-weight: 800 !important;
  color: var(--ink-900) !important;
  letter-spacing: -0.02em !important;
  text-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
.el-dialog__body {
  padding: 20px 28px 24px !important;
  background: var(--white) !important;
}

.el-dialog__footer {
  padding: 14px 28px !important;
  background: var(--ink-50) !important;
  border-top: 1px solid var(--border-subtle) !important;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
}

/* —— 档案类表单板块 (Archive Form Sectors) —— */
.form-sector {
  margin-bottom: 16px;
  padding-bottom: 14px;
  border-bottom: 1px dashed var(--border-subtle);
}

.form-sector:last-child {
  border-bottom: none;
  margin-bottom: 0;
}

.form-sector-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--mint-700);
  margin-bottom: 12px;
  position: relative;
}

.form-sector-title::before {
  content: '';
  width: 4px;
  height: 12px;
  background: var(--brand-mint);
  border-radius: 2px;
}

/* —— 紧凑表单项 —— */
.el-form-item {
  margin-bottom: 14px !important;
}
.el-form-item--small.el-form-item {
  margin-bottom: 12px !important;
}

/* ========== 标签 ========== */
.el-tag {
  border-radius: var(--radius-pill) !important;
  font-weight: 600 !important;
  padding: 0 12px !important;
}

.el-tag--primary {
  background: var(--surface-brand-soft) !important;
  color: var(--mint-600) !important;
  border: 1px solid var(--mint-200) !important;
}
